<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Sensor App - Auto Round</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1976d2; --success: #4caf50; --warning: #fbc02d; --danger: #f44336; --bg: #f5f7fa; }
    body { font-family: "Kanit", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #334155; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: 0.4s ease; }
    .bg-normal { background: #fff; }
    .bg-green { background: #dcfce7 !important; }
    .bg-yellow { background: #fef3c7 !important; }
    .bg-red { background: #fee2e2 !important; }

    h1 { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 5px; }
    .sub-title { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .round-tag { background: rgba(25, 118, 210, 0.1); color: var(--primary); padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; display: inline-block; margin-bottom: 15px; }
    
    .value-display { font-size: 64px; font-weight: 700; line-height: 1; margin: 10px 0; font-variant-numeric: tabular-nums; }
    canvas { width: 100%; height: 80px; border-radius: 15px; background: rgba(0,0,0,0.03); margin: 15px 0; }

    button { width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
    .btn-start { background: var(--primary); color: white; }
    .btn-outline { background: rgba(0,0,0,0.05); color: #64748b; }
    
    .input-group { margin-bottom: 15px; text-align: left; }
    input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-family: 'Kanit'; font-size: 16px; }
    .hidden { display: none; }
    #advice-box { text-align: left; padding: 15px; border-radius: 15px; margin-top: 15px; font-size: 14px; line-height: 1.6; }
    .advice-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container" id="page1">
    <center><img width="80px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6dh1EFfBVQyfw8WKTTaaqjwzfRXWzLyL6yw&s" alt="Logo"></center>
    <h1>Health Sensor App</h1>
    <div class="sub-title">ชมรมนักประดิษฐ์ โรงเรียนโนนสะอาดพิทยาสรรค์</div>
    <div class="input-group"><label>ชื่อผู้ใช้งาน</label><input id="name" type="text" placeholder="ระบุชื่อ"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-group"><label>อายุ (ปี)</label><input id="age" type="number" placeholder="ระบุอายุ"></div>
        <div class="input-group"><label>ส่วนสูง (ซม.)</label><input id="height" type="number" placeholder="ระบุส่วนสูง"></div>
    </div>
    <div class="input-group"><label>เพศ</label><select id="gender"><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option></select></div>
    <button class="btn-start" onclick="initMicAndNextPage()">เข้าสู่การทดสอบ 🚀</button>
</div>

<div class="container" id="page2" style="text-align: center; display: none;">
    <div style="background:#fff3cd; color:#856404; padding:8px; border-radius:10px; font-size:12px; margin-bottom:10px;">📏 <b>ถือห่าง 5-10 ซม.</b> เป่าแล้วระบบจะขยับรอบเองอัตโนมัติ</div>
    <div class="round-tag">รอบที่ <span id="roundNo">1</span> / 5</div>
    <div id="status-display">
        <div id="status-text" style="font-size: 18px; font-weight: 600;">สูดลมหายใจ... แล้วเป่าเลย!</div>
        <div class="value-display"><span id="val-num">0</span> <span style="font-size:16px">L/min</span></div>
        <div style="font-size: 18px;">⏱ <span id="current-timer">0.00</span> วินาที</div>
    </div>
    <canvas id="graphCanvas"></canvas>
    <button id="startBtn" class="btn-start" onclick="startTestRound()">▶️ เริ่มการทดสอบ (5 รอบ)</button>
</div>

<div class="container hidden" id="page3" style="text-align: center;">
    <h1>📊 สรุปผลการทดสอบ</h1>
    <div id="summary-data" style="background:rgba(0,0,0,0.02); padding:15px; border-radius:15px; margin:15px 0; text-align:left;"></div>
    <div id="final-card" style="padding:20px; border-radius:20px; border: 1px solid #eee;">
        <div id="final-status" style="font-size:24px; font-weight:700;"></div>
        <div style="font-size: 14px; margin: 5px 0;">ค่าเฉลี่ยแรงลม: <span id="final-avg-val">0</span> L/min</div>
    </div>
    <div id="advice-box"></div>
    <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ccc;">
    <button class="btn-start" onclick="window.print()">💾 พิมพ์ผลการทดสอบ</button>
    <button class="btn-outline" onclick="location.reload()">🔄 เริ่มการทดสอบใหม่</button>
</div>

<script>
    let user = {}, round = 0, allRounds = [], allDurations = [], isMeasuring = false;
    let audioContext, analyser, microphone, lowpassFilter, dataArray, animationId, globalStream;
    let currentRoundMax = 0, startTime = 0, roundDuration = 0, smoothedValue = 0;
    let hasReachedThreshold = false; // ตัวแปรเช็คว่าเริ่มเป่าแรงหรือยัง
    const smoothingFactor = 0.15;

    function getPredictedPEFR(age, height, gender) {
        let base = (gender === 'ชาย') ? ((height - 100) * 5 + 100) : ((height - 100) * 4 + 50);
        return Math.max(200, Math.round(base - (age * 0.5)));
    }

    async function initMicAndNextPage() {
        const n = document.getElementById('name').value, a = document.getElementById('age').value, h = document.getElementById('height').value, g = document.getElementById('gender').value;
        if (!n || !a || !h || !g) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');
        try {
            globalStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            user = { name: n, age: parseInt(a), height: parseInt(h), gender: g };
            user.predicted = getPredictedPEFR(user.age, user.height, user.gender);
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';
        } catch (e) { alert('ไม่สามารถเข้าถึงไมโครโฟนได้'); }
    }

    async function startTestRound() {
        if (round >= 5) return;
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(globalStream);
            lowpassFilter = audioContext.createBiquadFilter();
            lowpassFilter.type = "lowpass";
            lowpassFilter.frequency.value = 350;
            microphone.connect(lowpassFilter);
            lowpassFilter.connect(analyser);
            analyser.fftSize = 1024;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }
        
        round++;
        resetRoundData();
        document.getElementById('startBtn').classList.add('hidden');
        isMeasuring = true;
        runLoop();
    }

    function resetRoundData() {
        currentRoundMax = 0;
        roundDuration = 0;
        startTime = 0;
        smoothedValue = 0;
        hasReachedThreshold = false; // รีเซ็ตสถานะการเริ่มเป่า
        document.getElementById('roundNo').textContent = round;
        document.getElementById('val-num').textContent = "0";
        document.getElementById('current-timer').textContent = "0.00";
        document.getElementById('status-text').textContent = "รอบที่ " + round + ": เป่าเลย!";
        document.getElementById('page2').className = "container bg-normal";
    }

    function runLoop() {
        const canvas = document.getElementById('graphCanvas'), ctx = canvas.getContext('2d'), pageContainer = document.getElementById('page2'), statusText = document.getElementById('status-text');
        
        function draw() {
            if (!isMeasuring) return;
            analyser.getByteFrequencyData(dataArray);
            
            let sumSquares = 0;
            for (let i = 0; i < dataArray.length; i++) { sumSquares += dataArray[i] * dataArray[i]; }
            let rms = Math.sqrt(sumSquares / dataArray.length);

            let rawPefr = Math.min(900, rms * 6.0); 
            smoothedValue = (rawPefr * smoothingFactor) + (smoothedValue * (1 - smoothingFactor));
            let displayValue = smoothedValue < 15 ? 0 : smoothedValue;

            // 1. ตรวจสอบจุดเริ่มเป่า (ต้องแรงกว่า 50 ถึงจะเริ่มนับว่าเป็นการเป่าจริง)
            if (displayValue > 50 && !hasReachedThreshold) {
                hasReachedThreshold = true;
                startTime = Date.now();
            }

            if (hasReachedThreshold) {
                roundDuration = (Date.now() - startTime) / 1000;
                document.getElementById('current-timer').textContent = roundDuration.toFixed(2);
                if (displayValue > currentRoundMax) currentRoundMax = displayValue;
                
                let ratio = (displayValue / user.predicted) * 100;
                if (ratio >= 55) { pageContainer.className = "container bg-green"; statusText.textContent = "เยี่ยม! 🟢"; }
                else if (ratio >= 35) { pageContainer.className = "container bg-yellow"; statusText.textContent = "อีกนิด! 🟡"; }
                else { pageContainer.className = "container bg-red"; statusText.textContent = "เบาไป! 🔴"; }

                // 2. Logic ตัดรอบ: ถ้าเคยเป่าแรงแล้ว และค่าลดลงมาต่ำกว่า 30 ให้จบลูกทันที
                if (displayValue < 30 && roundDuration > 0.3) {
                    stopAndAutoNext();
                    return; // หยุด draw loop นี้
                }
            }
            
            document.getElementById('val-num').textContent = Math.round(displayValue);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(25, 118, 210, 0.5)';
            ctx.fillRect(0, canvas.height, canvas.width, -(displayValue/900 * canvas.height));
            animationId = requestAnimationFrame(draw);
        }
        draw();
    }

    function stopAndAutoNext() {
        isMeasuring = false;
        cancelAnimationFrame(animationId);
        allRounds.push(currentRoundMax);
        allDurations.push(roundDuration);
        
        if (round < 5) {
            document.getElementById('status-text').textContent = "บันทึกรอบที่ " + round + " แล้ว... เตรียมรอบถัดไป";
            setTimeout(() => {
                startTestRound(); // เริ่มรอบใหม่ให้อัตโนมัติ
            }, 1200); // หน่วงเวลา 1.2 วินาทีเพื่อให้ผู้ใช้พักหายใจ
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById('page2').style.display = 'none';
        document.getElementById('page3').classList.remove('hidden');
        const avgPefr = allRounds.reduce((a, b) => a + b, 0) / 5;
        const ratio = (avgPefr / user.predicted) * 100;
        
        document.getElementById('summary-data').innerHTML = `
            <b>ผู้ใช้งาน:</b> ${user.name}<br>
            <b>ประสิทธิภาพเฉลี่ย:</b> ${ratio.toFixed(1)}% ของค่ามาตรฐาน (${user.predicted} L/min)
        `;

        document.getElementById('final-avg-val').textContent = Math.round(avgPefr);
        
        const st = document.getElementById('final-status'), card = document.getElementById('final-card'), adv = document.getElementById('advice-box');
        if (ratio >= 55) {
            st.textContent = "ปกติ 🟢"; card.style.background = "#dcfce7"; card.style.color = "#15803d";
            adv.innerHTML = `สุขภาพปอดดีเยี่ยม ควรออกกำลังกายสม่ำเสมอ`;
        } else if (ratio >= 35) {
            st.textContent = "เฝ้าระวัง 🟡"; card.style.background = "#fef3c7"; card.style.color = "#b45309";
            adv.innerHTML = `สมรรถภาพปอดเริ่มลดลง ควรฝึกการหายใจลึกๆ`;
        } else {
            st.textContent = "ควรพบแพทย์ 🔴"; card.style.background = "#fee2e2"; card.style.color = "#b91c1c";
            adv.innerHTML = `ค่าแรงลมต่ำกว่าเกณฑ์มาก ควรปรึกษาแพทย์โดยเร็ว`;
        }
    }
</script>
</body>
</html>
