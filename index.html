<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Sensor App - Professional Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1976d2; --success: #2e7d32; --warning: #fbc02d; --danger: #d32f2f; --bg: #f8fafc; }
    body { font-family: "Kanit", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #334155; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 5px; }
    .sub-title { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    
    #status-display { padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; transition: 0.2s; }
    .status-idle { background: #f8fafc; color: #64748b; border: 2px dashed #e2e8f0; }
    .status-active { background: #f0fdf4; color: #15803d; border: 2px solid #dcfce7; }
    .value-display { font-size: 64px; font-weight: 700; line-height: 1; margin: 10px 0; }
    
    /* Zone Indicator Bar */
    .zone-bar-container { height: 12px; background: #eee; border-radius: 6px; overflow: hidden; display: flex; margin: 20px 0; }
    .zone { height: 100%; }
    .z-red { width: 50%; background: var(--danger); opacity: 0.3; }
    .z-yellow { width: 30%; background: var(--warning); opacity: 0.3; }
    .z-green { width: 20%; background: var(--success); opacity: 0.3; }
    .active-z { opacity: 1 !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }

    .result-card { padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px; border: 1px solid #eee; }
    button { width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
    .btn-start { background: var(--primary); color: white; }
    .btn-stop { background: var(--danger); color: white; }
    .btn-outline { background: #f1f5f9; color: #64748b; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container" id="page1">
    <center><img width="80px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6dh1EFfBVQyfw8WKTTaaqjwzfRXWzLyL6yw&s" alt="Logo"></center>
    <h1>Health Sensor App</h1>
    <div class="sub-title">ระบบวิเคราะห์ระดับสมรรถภาพปอด</div>
    <div style="margin-bottom:15px"><label>ชื่อ</label><input id="name" type="text" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd" placeholder="ระบุชื่อ"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom:15px">
        <div><label>อายุ</label><input id="age" type="number" value="25" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd"></div>
        <div><label>ส่วนสูง (ซม.)</label><input id="height" type="number" value="170" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd"></div>
    </div>
    <div style="margin-bottom:20px"><label>เพศ</label><select id="gender" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd"><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option></select></div>
    <button class="btn-start" onclick="initApp()">เข้าสู่การทดสอบ 🚀</button>
</div>

<div class="container hidden" id="page2" style="text-align: center;">
    <div style="font-weight: 600; color: var(--primary); margin-bottom: 10px;">รอบที่ <span id="roundNo">1</span> / 5</div>
    <div id="status-display" class="status-idle">
        <div id="status-text">หายใจลึกๆ แล้วเป่าให้สุดแรง!</div>
        <div class="value-display" id="val-num">0</div>
        <div style="font-size:14px; opacity:0.6">L/min</div>
    </div>
    <div class="zone-bar-container">
        <div id="live-red" class="zone z-red"></div>
        <div id="live-yellow" class="zone z-yellow"></div>
        <div id="live-green" class="zone z-green"></div>
    </div>
    <button id="startBtn" class="btn-start" onclick="startReading()">▶️ เริ่มเป่า</button>
    <button id="stopBtn" class="btn-stop hidden" onclick="confirmValue()">⏹️ บันทึกค่า</button>
</div>

<div class="container hidden" id="page3">
    <h1 style="text-align:center">📊 ผลการทดสอบ</h1>
    <div id="user-info" style="font-size:14px; background:#f1f5f9; padding:15px; border-radius:15px; margin-bottom:15px"></div>
    
    <div class="result-card" id="final-card">
        <div style="font-size:14px; color:#64748b">ค่าที่ดีที่สุดของคุณ (Best Effort)</div>
        <div id="final-best" style="font-size:54px; font-weight:700;">0</div>
        <div id="final-percent" style="font-size:16px; font-weight:500; margin-bottom:15px"></div>
        
        <div style="text-align:left; font-size:14px; margin-bottom:5px">ระดับสมรรถภาพ:</div>
        <div class="zone-bar-container" style="margin:0">
            <div id="f-red" class="zone z-red"></div>
            <div id="f-yellow" class="zone z-yellow"></div>
            <div id="f-green" class="zone z-green"></div>
        </div>
        <div id="final-interpretation" style="font-size:18px; font-weight:700; margin-top:15px"></div>
    </div>

    <button class="btn-start" onclick="window.print()">💾 พิมพ์รายงาน PDF</button>
    <button class="btn-outline" onclick="location.reload()">🔄 เริ่มใหม่</button>
</div>

<script>
    let user = {}, round = 0, allRounds = [], isRunning = false;
    let audioCtx, analyser, dataArray, micStream, animationId;
    let currentPeak = 0, smoothedValue = 0;

    async function initApp() {
        user = {
            name: document.getElementById('name').value,
            age: parseInt(document.getElementById('age').value),
            height: parseInt(document.getElementById('height').value),
            gender: document.getElementById('gender').value
        };
        user.predicted = user.gender === 'ชาย' 
            ? Math.round(((user.height/100 * 5.48) - (user.age * 0.031) - 0.42) * 60)
            : Math.round(((user.height/100 * 3.72) - (user.age * 0.031) - 0.42) * 60);

        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
    }

    function startReading() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.4;
            audioCtx.createMediaStreamSource(micStream).connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }
        round++;
        currentPeak = 0;
        document.getElementById('roundNo').textContent = round;
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('stopBtn').classList.remove('hidden');
        document.getElementById('status-display').className = "status-active";
        isRunning = true;
        updateLoop();
    }

    function updateLoop() {
        if (!isRunning) return;
        analyser.getByteFrequencyData(dataArray);
        let avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
        let target = Math.min(900, avg * 28.0);
        smoothedValue += (target - smoothedValue) * 0.5;
        if (smoothedValue > currentPeak) currentPeak = smoothedValue;

        document.getElementById('val-num').textContent = Math.round(smoothedValue);
        
        let pct = (smoothedValue / user.predicted) * 100;
        document.getElementById('live-red').className = "zone z-red " + (pct < 50 && smoothedValue > 20 ? "active-z" : "");
        document.getElementById('live-yellow').className = "zone z-yellow " + (pct >= 50 && pct < 80 ? "active-z" : "");
        document.getElementById('live-green').className = "zone z-green " + (pct >= 80 ? "active-z" : "");

        animationId = requestAnimationFrame(updateLoop);
    }

    function confirmValue() {
        isRunning = false;
        cancelAnimationFrame(animationId);
        allRounds.push(currentPeak);
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('stopBtn').classList.add('hidden');
        document.getElementById('status-display').className = "status-idle";
        if (round >= 5) showResult();
    }

    function showResult() {
        document.getElementById('page2').classList.add('hidden');
        document.getElementById('page3').classList.remove('hidden');
        const best = Math.max(...allRounds);
        const pct = Math.round((best / user.predicted) * 100);

        document.getElementById('user-info').innerHTML = `<b>ผู้ตรวจ:</b> ${user.name} | <b>ค่ามาตรฐาน:</b> ${user.predicted} L/min`;
        document.getElementById('final-best').textContent = Math.round(best);
        document.getElementById('final-percent').textContent = `ประสิทธิภาพปอด: ${pct}%`;

        const st = document.getElementById('final-interpretation');
        const card = document.getElementById('final-card');
        
        // เซ็ตความสว่างของแถบสีในหน้าสรุป
        document.getElementById('f-red').classList.toggle('active-z', pct < 50);
        document.getElementById('f-yellow').classList.toggle('active-z', pct >= 50 && pct < 80);
        document.getElementById('f-green').classList.toggle('active-z', pct >= 80);

        if(pct >= 80) { st.textContent = "ปกติ (Green Zone) ✅"; st.style.color = "var(--success)"; card.style.background="#f0fdf4"; }
        else if(pct >= 50) { st.textContent = "เฝ้าระวัง (Yellow Zone) ⚠️"; st.style.color = "var(--warning)"; card.style.background="#fffbeb"; }
        else { st.textContent = "ควรพบแพทย์ (Red Zone) 🚨"; st.style.color = "var(--danger)"; card.style.background="#fef2f2"; }
    }
</script>
</body>
</html>
