<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Sensor App - Natural Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1976d2; --success: #4caf50; --warning: #fbc02d; --danger: #f44336; --bg: #f5f7fa; }
    body { font-family: "Kanit", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #334155; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 5px; }
    .sub-title { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    
    #status-display { padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .status-idle { background: #f8fafc; color: #64748b; border: 2px dashed #e2e8f0; }
    .status-active { background: #f0fdf4; color: #15803d; border: 2px solid #dcfce7; transform: scale(1.02); }

    .value-display { font-size: 64px; font-weight: 700; line-height: 1; margin: 10px 0; font-variant-numeric: tabular-nums; }
    canvas { width: 100%; height: 120px; border-radius: 15px; background: #fafafa; margin: 15px 0; border: 1px solid #eee; }

    .round-tag { background: #e0f2fe; color: var(--primary); padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; display: inline-block; margin-bottom: 15px; }
    button { width: 100%; padding: 15px; border-radius: 15px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
    .btn-start { background: var(--primary); color: white; }
    .btn-stop { background: var(--danger); color: white; }
    .btn-outline { background: #f1f5f9; color: #64748b; }
    
    .input-group { margin-bottom: 15px; }
    input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-family: 'Kanit'; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container" id="page1">
    <center><img width="80px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6dh1EFfBVQyfw8WKTTaaqjwzfRXWzLyL6yw&s" alt="Logo"></center>
    <h1>Health Sensor App</h1>
    <div class="sub-title">ระบบวิเคราะห์สมรรถภาพปอด (Natural Version)</div>
    <div class="input-group"><label>ชื่อ</label><input id="name" type="text" placeholder="ระบุชื่อ"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-group"><label>อายุ</label><input id="age" type="number" value="20"></div>
        <div class="input-group"><label>ส่วนสูง (ซม.)</label><input id="height" type="number" value="165"></div>
    </div>
    <div class="input-group"><label>เพศ</label><select id="gender"><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option></select></div>
    <button class="btn-start" onclick="initApp()">เริ่มการทดสอบ</button>
</div>

<div class="container hidden" id="page2" style="text-align: center;">
    <div class="round-tag">รอบที่ <span id="roundNo">1</span> / 5</div>
    <div id="status-display" class="status-idle">
        <div id="status-text">พร้อม... เป่าแรงๆ ทันที!</div>
        <div class="value-display" id="val-num">0</div>
        <div style="font-size:14px; opacity:0.7">Liters per minute</div>
    </div>
    <canvas id="liveGraph"></canvas>
    <button id="startBtn" class="btn-start" onclick="startReading()">▶️ เริ่มเป่า</button>
    <button id="stopBtn" class="btn-stop hidden" onclick="confirmValue()">⏹️ ยืนยันค่านี้</button>
</div>

<div class="container hidden" id="page3" style="text-align: center;">
    <h1>📊 สรุปผลทางการแพทย์</h1>
    <div id="final-card" style="padding:25px; border-radius:20px; margin-bottom:20px; background:#f8fafc;">
        <div style="font-size: 14px; color:#64748b">ค่าที่ดีที่สุดของคุณ (Best Effort)</div>
        <div id="final-best" style="font-size:56px; font-weight:700; color:var(--primary);">0</div>
        <div id="final-status" style="font-size:18px; font-weight:600; margin-top:10px;"></div>
        <div id="final-detail" style="font-size:14px; margin-top:5px; color:#94a3b8;"></div>
    </div>
    <button class="btn-start" onclick="window.print()">💾 พิมพ์รายงาน PDF</button>
    <button class="btn-outline" onclick="location.reload()">🔄 เริ่มใหม่</button>
</div>

<script>
    let user = {}, round = 0, allRounds = [], isRunning = false;
    let audioCtx, analyser, dataArray, micStream, animationId;
    let currentPeak = 0, smoothedValue = 0;

    async function initApp() {
        const fields = ['name', 'age', 'height', 'gender'];
        for(let f of fields) { if(!document.getElementById(f).value) return alert('กรุณากรอกข้อมูล'); }
        
        user = {
            name: document.getElementById('name').value,
            age: parseInt(document.getElementById('age').value),
            height: parseInt(document.getElementById('height').value),
            gender: document.getElementById('gender').value
        };
        
        // สูตร Gregg and Nunn เพื่อหาค่ามาตรฐาน
        user.predicted = user.gender === 'ชาย' 
            ? Math.round(((user.height/100 * 5.48) - (user.age * 0.031) - 0.42) * 60)
            : Math.round(((user.height/100 * 3.72) - (user.age * 0.031) - 0.42) * 60);

        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
    }

    function startReading() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.3; // ทำให้การเปลี่ยนแปลงดูเป็นธรรมชาติ
            const src = audioCtx.createMediaStreamSource(micStream);
            src.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }
        
        round++;
        currentPeak = 0;
        document.getElementById('roundNo').textContent = round;
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('stopBtn').classList.remove('hidden');
        document.getElementById('status-display').className = "status-active";
        isRunning = true;
        visualize();
    }

    function visualize() {
        if (!isRunning) return;
        const canvas = document.getElementById('liveGraph');
        const ctx = canvas.getContext('2d');
        
        analyser.getByteFrequencyData(dataArray);
        let rawAvg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
        
        // ปรับจูนค่าให้นิ่งแต่ตอบสนองเร็ว (Simple Low-pass filter)
        let targetValue = Math.min(900, rawAvg * 25.0);
        smoothedValue += (targetValue - smoothedValue) * 0.4; 
        
        if (smoothedValue > currentPeak) currentPeak = smoothedValue;

        document.getElementById('val-num').textContent = Math.round(smoothedValue);
        
        // วาดกราฟ
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e3f2fd';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'var(--primary)';
        let barHeight = (smoothedValue / 900) * canvas.height;
        ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

        animationId = requestAnimationFrame(visualize);
    }

    function confirmValue() {
        isRunning = false;
        cancelAnimationFrame(animationId);
        allRounds.push(currentPeak);
        
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('stopBtn').classList.add('hidden');
        document.getElementById('status-display').className = "status-idle";
        document.getElementById('status-text').textContent = `บันทึกค่า ${Math.round(currentPeak)} แล้ว`;
        
        if (round >= 5) showResult();
    }

    function showResult() {
        document.getElementById('page2').classList.add('hidden');
        document.getElementById('page3').classList.remove('hidden');
        
        const best = Math.max(...allRounds);
        const pct = Math.round((best / user.predicted) * 100);
        
        document.getElementById('final-best').textContent = Math.round(best) + " L/min";
        document.getElementById('final-detail').textContent = `เทียบกับมาตรฐาน: ${user.predicted} L/min (${pct}%)`;
        
        const st = document.getElementById('final-status');
        if(pct >= 80) { st.textContent = "ผลการตรวจ: ปกติ (Green Zone) 🟢"; st.style.color = "var(--success)"; }
        else if(pct >= 50) { st.textContent = "ผลการตรวจ: เฝ้าระวัง (Yellow Zone) 🟡"; st.style.color = "var(--warning)"; }
        else { st.textContent = "ผลการตรวจ: ควรพบแพทย์ (Red Zone) 🔴"; st.style.color = "var(--danger)"; }
    }
</script>
</body>
</html>
